# AI model definitions for Kanbai chat.
#
# Each entry maps a UI handle (shown in the model picker dropdown) to the
# environment variable that holds the Azure OpenAI deployment name.
# Handle must be fewer than 16 characters.
#
# To add a new model:
#   1. Add an entry here with a unique handle and the env var name.
#   2. Set that env var in your .env file to the actual deployment name.
#
# The first entry is the default selection on startup.

models:
  - handle: nano
    env_var: AZURE_OPENAI_DEPLOYMENT_NANO

  - handle: mini
    env_var: AZURE_OPENAI_DEPLOYMENT_MINI

  - handle: base
    env_var: AZURE_OPENAI_DEPLOYMENT_BASE

  - handle: codex
    env_var: AZURE_OPENAI_DEPLOYMENT_CODEX
