[project]
name = "kanbai"
version = "0.3.0"
description = "AI-powered Kanban board — per-repo CLI sidecar for humans and agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "typer>=0.15.0",
  "fastmcp>=3.4.2",
  "flet>=0.85.3",
  "flet-web>=0.85.3",
  "flet-charts>=0.85.3",
  "matplotlib>=3.10.9",
  "openai>=1.50.0",
  "python-dotenv>=1.2.2",
  "python-frontmatter>=1.3.0",
  "pyyaml>=6.0.3",
  "fastapi[standard]>=0.136.3",
  "python-docx>=1.2.0",
  "watchdog>=4.0.0",
  "pathspec>=1.1.1",
]

[project.scripts]
kanbai = "kanbai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kanbai = ["docs/*.md"]

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
